name: Offline demonstration checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python projects/readability_demo/analyze.py
      - run: python projects/bike_demand/run.py
      - name: Check committed results match the executed pipeline
        run: git diff --exit-code -- projects/readability_demo/results.json projects/bike_demand/outputs
